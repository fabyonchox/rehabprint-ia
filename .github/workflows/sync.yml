name: 🤖 RehabPrint IA — Sincronizar Agentes

on:
  # Permite activarlo manualmente desde GitHub.com o desde la plataforma web
  workflow_dispatch:
  # Sincronización automática cada 30 minutos
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client

      - name: 🔑 Restaurar credenciales Google
        env:
          GOOGLE_CREDENTIALS_SECRET: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_SECRET" ]; then
            echo "$GOOGLE_CREDENTIALS_SECRET" > credentials.json
          fi

      - name: 🤖 Ejecutar Agentes IA — Sincronizar Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python sync_sheets.py

      - name: 📤 Publicar datos actualizados en Vercel
        run: |
          git config user.name  "RehabPrint Bot"
          git config user.email "bot@rehabprint-ia.app"
          git add live_data.js live_data.json
          if [ -d "rehabprint-ia" ]; then
            git add rehabprint-ia/live_data.js rehabprint-ia/live_data.json || true
          fi
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos en Google Sheets."
          else
            git commit -m "🤖 Sync automático [$(date '+%d/%m/%Y %H:%M')] — Agentes IA"
            git push
          fi
